# PGM Outfitters — cache headers (PageSpeed phase A)
#
# Live box (Kyle):
#   Site root:     ~/pgmoutfitters.com
#   nginx vhost:   /etc/nginx/sites-available/pgmoutfitters.com
#
# Merge these location rules into the existing server { } block.
# Do not replace the whole vhost — keep the current root, TLS, and
# prerender try_files as they are, and add/adjust Cache-Control only.
#
# CRA production builds emit content-hashed files under /static/js,
# /static/css, and /static/media. Those filenames change when the
# bytes change, so a long immutable cache is safe.
# HTML (index.html and prerendered routes) must stay short / revalidate
# so deploys are visible immediately.

# Hashed webpack assets (JS, CSS, images emitted to /static/media)
location ^~ /static/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# Explicit HTML files
location ~* \.html$ {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
}

# After adding headers, reload nginx:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Verify:
#   curl -I https://pgmoutfitters.com/static/js/main.<hash>.js
#     → Cache-Control: public, max-age=31536000, immutable
#   curl -I https://pgmoutfitters.com/
#     → Cache-Control: public, max-age=0, must-revalidate
#
# The document-root location / (SPA + prerendered routes) should use the
# same short HTML cache. Example if that location does not already set it:
#
# location / {
#     add_header Cache-Control "public, max-age=0, must-revalidate" always;
#     try_files $uri $uri/ $uri.html /index.html;
# }
