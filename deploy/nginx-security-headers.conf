# PGM Outfitters — security headers (PageSpeed phase D)
#
# Live box (Kyle):
#   Site root:     ~/pgmoutfitters.com
#   nginx vhost:   /etc/nginx/sites-available/pgmoutfitters.com
#
# Frontend vhost ONLY (pgmoutfitters.com / www). Do not paste this into
# api.pgmoutfitters.com — that Express app already sends its own Helmet
# CSP (default-src 'none') on JSON responses.
#
# Apply on the HTTPS server { } block. The HTTP server should keep its
# 301 to HTTPS and should not send HSTS (browsers ignore HSTS on HTTP).
#
# nginx inheritance gotcha:
#   add_header on a location replaces parent add_header instead of merging.
#   If Cache-Control locations from nginx-cache-headers.conf already set
#   add_header, include THIS file in those locations as well as in server { }.
#
#   server {
#       include /home/ubuntu/pgmoutfitters.com/deploy/nginx-security-headers.conf;
#       location ^~ /static/ {
#           add_header Cache-Control "public, max-age=31536000, immutable" always;
#           include /home/ubuntu/pgmoutfitters.com/deploy/nginx-security-headers.conf;
#       }
#       location ~* \.html$ {
#           add_header Cache-Control "public, max-age=0, must-revalidate" always;
#           include /home/ubuntu/pgmoutfitters.com/deploy/nginx-security-headers.conf;
#       }
#       location / {
#           add_header Cache-Control "public, max-age=0, must-revalidate" always;
#           include /home/ubuntu/pgmoutfitters.com/deploy/nginx-security-headers.conf;
#           try_files $uri $uri/ $uri.html /index.html;
#       }
#   }
#
# After adding headers, reload nginx:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Verify (HTTPS only):
#   curl -sI https://pgmoutfitters.com/ | grep -iE 'strict-transport|content-security|x-frame|cross-origin-opener|x-content-type|referrer-policy|permissions-policy'
#   curl -sI https://www.pgmoutfitters.com/
#   Chrome DevTools → Console / Network on /, /deer-feeders/2-n-1, /dealers/delta-outdoors, /cart
#     Report-Only CSP must not log needed Typekit, gtag, Maps, or API calls.
#     Then start checkout (redirect to checkout.stripe.com) and return to /checkout/success.
#
# Investigated 2026-09-09 against live + this repo:
#   Live HTTPS apex/www: nginx/1.18, Cache-Control from phase A, no HSTS/CSP/COOP/XFO.
#   HTTP → HTTPS 301. Cert SAN: pgmoutfitters.com, www.pgmoutfitters.com.
#   No other public A/CNAME under the domain except api (same box, own cert).
#   index.html: inline gtag + async googletagmanager (G-MNNBCH3N3B, AW-11171481429).
#   Fonts: use.typekit.net (live still @imports yby0lpp.css; develop uses /typekit-swap.css
#   + font-src use.typekit.net). Dealer iframes: maps.google.com/?output=embed.
#   Checkout: POST https://api.pgmoutfitters.com/api/checkout/session, then
#   window.location.assign to checkout.stripe.com (full page, not Stripe.js / iframe).
#   Inquiry is unused on live — flagcdn.com is only for that phone-input chunk.
#   Prerendered HTML has inline <style> (SVGs) and the Typekit preload onload= handler.
#
# ---------------------------------------------------------------------------
# Enforced now (safe; does not restrict scripts, styles, images, or XHR)
# ---------------------------------------------------------------------------

# HSTS: 1 year. includeSubDomains is safe today: apex, www, and api all speak
# HTTPS with valid certs; no other public subdomains exist. Do NOT add preload
# yet — api HTTP still 404s without a redirect, and preload is hard to undo.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Clickjacking. Site is not framed by us. SAMEORIGIN + frame-ancestors 'self'
# (in the enforced CSP below). Maps/Stripe are the embedders, not the embeddee.
add_header X-Frame-Options "SAMEORIGIN" always;

# Minimal enforcing CSP. No default-src / script-src / style-src here — those
# would break the prerendered SPA, gtag, Typekit, and Maps if they were wrong.
# Full allowlist is Report-Only until the console stays clean, then flip.
add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://checkout.stripe.com; upgrade-insecure-requests" always;

# COOP: isolate this origin from cross-origin window.opener. Checkout is a
# top-level assign() to Stripe, not a popup, so same-origin is fine.
# Do NOT set Cross-Origin-Embedder-Policy (require-corp would block Typekit,
# gtag, and Maps). CORP same-origin only limits who can fetch OUR assets.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# ---------------------------------------------------------------------------
# CSP Report-Only — watch DevTools, then promote to enforce
# ---------------------------------------------------------------------------
# Allows first-party + required third parties. Tighten later:
#   1. After 1–2 weeks with no CSP violations, rename this header to
#      Content-Security-Policy and remove the short enforce policy above
#      (or merge). Keep a rollback comment + nginx reload ready.
#   2. Drop https://use.typekit.net from style-src after the live @import
#      kit CSS is gone (keep it on font-src).
#   3. Drop flagcdn.com after Inquiry / @bebeau/phone-number-input is gone.
#   4. Replace 'unsafe-inline' with nonces only if nginx can stamp every
#      prerendered HTML file; do not break onload= on typekit-swap.css or
#      the inline gtag bootstrap.
#   5. If Stripe.js / embedded Checkout is added later, allow
#      https://js.stripe.com https://hooks.stripe.com in script-src /
#      frame-src / connect-src. Hosted Checkout redirect does not need them.
#   6. Optional: report-uri / report-to once an endpoint exists.
#   7. HSTS preload only after api.pgmoutfitters.com HTTP→HTTPS 301 and a
#      long clean period; submit at hstspreload.org — do not set preload
#      in this file until then.

add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self' https://checkout.stripe.com; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://www.googleadservices.com https://www.google.com https://googleads.g.doubleclick.net; style-src 'self' 'unsafe-inline' https://use.typekit.net; font-src 'self' data: https://use.typekit.net https://p.typekit.net; img-src 'self' data: blob: https://www.google-analytics.com https://www.googletagmanager.com https://www.google.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://pagead2.googlesyndication.com https://init-public.s3.amazonaws.com https://flagcdn.com https://maps.gstatic.com https://maps.googleapis.com https://maps.google.com; connect-src 'self' https://api.pgmoutfitters.com https://www.google-analytics.com https://analytics.google.com https://*.google-analytics.com https://*.analytics.google.com https://stats.g.doubleclick.net https://www.googletagmanager.com https://www.google.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://pagead2.googlesyndication.com https://region1.google-analytics.com; frame-src https://maps.google.com https://www.google.com https://www.googletagmanager.com https://td.doubleclick.net; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests" always;

# ---------------------------------------------------------------------------
# Full enforce policy (commented). Swap with Report-Only after it is clean.
# Do not enable alongside the short enforce CSP — duplicate CSP headers merge
# in unpredictable ways. Remove the short Content-Security-Policy line first.
# ---------------------------------------------------------------------------
# add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self' https://checkout.stripe.com; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://www.googleadservices.com https://www.google.com https://googleads.g.doubleclick.net; style-src 'self' 'unsafe-inline' https://use.typekit.net; font-src 'self' data: https://use.typekit.net https://p.typekit.net; img-src 'self' data: blob: https://www.google-analytics.com https://www.googletagmanager.com https://www.google.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://pagead2.googlesyndication.com https://init-public.s3.amazonaws.com https://flagcdn.com https://maps.gstatic.com https://maps.googleapis.com https://maps.google.com; connect-src 'self' https://api.pgmoutfitters.com https://www.google-analytics.com https://analytics.google.com https://*.google-analytics.com https://*.analytics.google.com https://stats.g.doubleclick.net https://www.googletagmanager.com https://www.google.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://pagead2.googlesyndication.com https://region1.google-analytics.com; frame-src https://maps.google.com https://www.google.com https://www.googletagmanager.com https://td.doubleclick.net; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests" always;
